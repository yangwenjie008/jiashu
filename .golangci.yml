version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - exhaustive
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - prealloc
    - revive
    - staticcheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (net.Listener).Close
        - (net.Conn).Close
        - (os.File).Close
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - "disableStutteringCheck"
            - "sayRepetitiveInsteadOfStutters"
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
          arguments:
            - "style"
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - gosec

formatters:
  enable:
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 3

severity:
  default: error
  rules:
    - linters:
        - govet
      severity: error
    - linters:
        - staticcheck
      severity: warning

output:
  sort-order:
    - file
    - linter
    - line
