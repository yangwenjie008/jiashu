run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - exhaustive
    - exportloopref
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goimports
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - prealloc
    - revive
    - staticcheck
    - stylecheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - whitespace

linters-settings:
  errcheck:
    check-blank: true
    exclude-functions:
      - (io.Closer).Close
      - (net.Listener).Close
      - (net.Conn).Close
      - (os.File).Close
  govet:
    enable-all: true
    disable:
      - fieldalignment
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
        arguments:
          - "disableStutteringCheck"
          - "sayRepetitiveInsteadOfStutters"
      - name: increment-decrement
      - name: var-naming
      - name: package-comments
        arguments:
          - "style"
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - gocyclo
        - gosec
  max-issues-per-linter: 50
  max-same-issues: 3

severity:
  default-severity: error
  rules:
    - linters:
        - govet
      severity: error
    - linters:
        - staticcheck
      severity: warning

output:
  sort-results: true
  sort-order:
    - file
    - linter
    - line
